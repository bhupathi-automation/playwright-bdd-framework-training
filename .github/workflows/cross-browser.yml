name: Cross-browser Cucumber

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to run, or all three engines
        required: true
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
        default: all

jobs:
  cucumber:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.browser == 'all' || matrix.browser == inputs.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run Cucumber in ${{ matrix.browser }}
        env:
          LOG_LEVEL: INFO
          LOG_TO_FILE: 'true'
          SCREENSHOT_ON_FAILURE: 'true'
          TRACE_ON_FAILURE: 'true'
          VIDEO_ON_FAILURE: 'false'
        run: npm run test:${{ matrix.browser }}
      - name: Generate Allure HTML report
        if: always() && hashFiles('artifacts/reports/allure-results/*-result.json') != ''
        run: npm run report:allure
      - name: Upload reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.browser }}
          path: |
            artifacts/reports/
            artifacts/screenshots/
            artifacts/traces/
            artifacts/videos/
            artifacts/logs/
          if-no-files-found: ignore
